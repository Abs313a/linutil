    <text x="151" text-anchor="middle" y="36" fill="#055bda" font-size="15" letter-spacing="2">READ THE SCRIPT</text>
    <rect x="127" y="58" width="48" height="42" rx="8" fill="#e0edff" stroke="#d4deed"/>
    <text x="151" y="85" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#055bda">p</text>
  </g>
  <g transform="translate(657,1)">
