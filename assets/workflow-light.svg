    <rect x="127" y="58" width="48" height="42" rx="8" fill="#e0edff" stroke="#d4deed"/>
    <text x="151" y="85" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#055bda">/</text>
  </g>
  <g transform="translate(329,1)">
    <rect width="302" height="124" rx="16" fill="#f6f8fc" stroke="#d4deed"/>
