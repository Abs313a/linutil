    <rect x="105.5" y="58" width="91" height="42" rx="8" fill="#e0edff" stroke="#d4deed"/>
    <text x="151" y="85" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#055bda">Enter</text>
