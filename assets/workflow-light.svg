<svg xmlns="http://www.w3.org/2000/svg" width="960" height="130" viewBox="0 0 960 130" role="img" aria-labelledby="title desc">
  <title id="title">Find it. Inspect it. Run it.</title>
  <desc id="desc">Search with /, preview the exact script with p, and press Enter to confirm and run.</desc>
